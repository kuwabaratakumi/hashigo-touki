name: データ更新・公開

on:
  schedule:
    # 毎週月曜 5:20（日本時間）。「次の開催」は閲覧時にブラウザで計算するので、週1回で足りる
    - cron: '20 20 * * 0'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: hashigo-touki
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: データ作成（CSV → JSON）
        run: node scripts/build.mjs

      - name: 開催日の計算テスト
        run: node scripts/test-schedule.mjs

      - name: Cloudflare の設定確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
            exit 1
          fi

      - name: Pages プロジェクトを用意（初回のみ作成）
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || echo "既にあるのでそのまま使います"

      - name: Cloudflare Pages へ公開
        run: npx --yes wrangler@3 pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true
