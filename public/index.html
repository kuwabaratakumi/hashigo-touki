<title>まわせ！はしご陶器市</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>
<body>
<header class="top">
  <div class="top__inner">
    <h1 class="brand"><svg class="brand__icon" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="brandMask"><rect width="100" height="100" fill="#fff"/><g fill="#000"><rect x="32" y="0" width="8" height="100"/><rect x="60" y="0" width="8" height="100"/><rect x="40" y="38" width="20" height="8"/><rect x="40" y="60" width="20" height="8"/></g></mask></defs><path d="M4 22 H96 C96 58 78 82 62 84 V94 H38 V84 C22 82 4 58 4 22 Z" fill="currentColor" mask="url(#brandMask)"/></svg>まわせ！はしご陶器市</h1>

  </div>
  <nav class="days" id="months" aria-label="月でしぼる"></nav>
  <div class="tools">
    <div class="view" role="radiogroup" aria-label="表示">
      <button type="button" data-view="calendar" aria-pressed="true">日程順</button>
      <button type="button" data-view="region" aria-pressed="false">産地別</button>
      <button type="button" data-view="hashigo" aria-pressed="false">はしご</button>
    </div>
    <div class="areas" id="regions" role="group" aria-label="地方"></div>
  </div>
</header>

<main class="main" id="main" aria-live="polite"></main>

<footer class="foot">
